[project]
name = "scrooge-infra"
version = "0.1.0"
description = "Self-hosted Postgres on Modal for the London borough spending data, plus the pg CLI that starts it and hands out its address."
readme = "README.md"
authors = [
    { name = "Radu Ciocan", email = "ciocan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.5,<2",
    "psycopg[binary]>=3.2.12",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
pg = "scrooge_infra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrooge_infra"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Same set as indexer/, so a file moved between the two projects keeps its
# import order and its modern syntax.
select = ["E4", "E7", "E9", "F", "I", "UP"]
