[project]
name = "spend-indexer"
version = "0.1.0"
description = "Download London borough council spending files (payments over £250/£500) and keep them raw on disk."
readme = "README.md"
authors = [
    { name = "Radu Ciocan", email = "ciocan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
spend = "spend_indexer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spend_indexer"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Defaults (E4/E7/E9/F) plus import sorting and pyupgrade, so a borough module
# contributed by another agent lands with the same import order as this core.
select = ["E4", "E7", "E9", "F", "I", "UP"]
