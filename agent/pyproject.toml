[project]
name = "scrooge-agent"
version = "0.1.0"
description = "Chat agent over London borough spending data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "logfire[fastapi,psycopg]>=5.1",
    "modal>=1.5.5,<2",
    "psycopg[binary,pool]>=3.2",
    "pydantic-ai-slim[google,ui]>=2.46.0",
    "uvicorn>=0.53.0",
]

[tool.vercel]
# Vercel's Python runtime would find `app` in main.py anyway; naming it here
# keeps the entrypoint from moving by accident.
entrypoint = "main:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
